<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJN WEB - Staff</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1e1f22;
            color: #f2f3f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111214;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #5865f2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 2rem;
            color: #5865f2;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(88, 101, 242, 0.6);
        }

        .discord-btn {
            background: #5865f2;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, transform 0.2s;
        }

        .discord-btn:hover {
            background: #4752c4;
            transform: scale(1.05);
        }

        .discord-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .grid-perfiles {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2rem;
        }

        .discord-card {
            background: #2b2d31;
            width: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .discord-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(88, 101, 242, 0.4);
        }

        .banner {
            height: 90px;
            background: linear-gradient(135deg, #5865f2, #eb459e);
            background-size: cover;
            background-position: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: -45px auto 0 auto;
        }

        .crown {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #313338;
            border: 6px solid #2b2d31;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #b5bac1;
        }

        .status-dot {
            width: 18px;
            height: 18px;
            background-color: #23a55a;
            border-radius: 50%;
            border: 3.5px solid #2b2d31;
            position: absolute;
            bottom: 2px;
            right: 2px;
        }

        .card-body {
            padding: 1.2rem;
            text-align: center;
        }

        .username {
            font-size: 1.3rem;
            font-weight: bold;
            color: #f2f3f5;
            margin-bottom: 0.8rem;
        }

        .role-badge {
            display: inline-block;
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .inspect-hint {
            margin-top: 0.8rem;
            font-size: 0.75rem;
            color: #949ba4;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #2b2d31;
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid #5865f2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            background: none;
            border: none;
            color: #b5bac1;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #ffffff;
        }

        .stats-box {
            background: #1e1f22;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1.2rem;
            text-align: left;
            border: 1px solid #383a40;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.5rem 0;
            border-bottom: 1px solid #2b2d31;
            font-size: 0.95rem;
            color: #dbdee1;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-emoji {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .join-btn {
            display: inline-block;
            background: #23a55a;
            color: white;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .join-btn:hover {
            background: #1d8a4b;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenid@s a CJN WEB</h1>
        <button class="discord-btn" onclick="openDiscordModal()">
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.92,96.1,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
            Discord
        </button>
    </header>

    <div class="container">
        <div class="grid-perfiles" id="perfiles-container"></div>
    </div>

    <!-- Modal Discord -->
    <div class="modal-overlay" id="discordModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('discordModal')">&times;</button>
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">👾</div>
            <h2 style="color: #f2f3f5;">Discord CJN</h2>
            <p style="color: #b5bac1; margin-top: 0.5rem;">¡Únete a nuestra comunidad oficial en Discord!</p>
            <a href="https://discord.gg/DwGQyasXtP" target="_blank" class="join-btn">Unirme al Servidor</a>
        </div>
    </div>

    <!-- Modal Inspeccionar Perfil -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
            <div style="font-size: 2.5rem;">👑</div>
            <h2 id="modalName" style="color: #f2f3f5; margin-top: 0.3rem;"></h2>
            <div id="modalRole" style="margin-top: 0.4rem;"></div>

            <div class="stats-box" id="modalStats"></div>
        </div>
    </div>

    <script>
        let usuariosData = [];

        fetch('/api/usuarios')
            .then(res => res.json())
            .then(data => {
                usuariosData = data;
                const container = document.getElementById('perfiles-container');
                container.innerHTML = '';

                data.forEach((user, index) => {
                    // Si el usuario tiene banner, genera el fondo con su archivo en la carpeta static
                    const bannerStyle = user.banner 
                        ? `style="background-image: url('/static/${user.banner}');"` 
                        : '';

                    container.innerHTML += `
                        <div class="discord-card" onclick="inspectProfile(${index})">
                            <div class="banner" ${bannerStyle}></div>
                            <div class="avatar-wrapper">
                                <span class="crown">👑</span>
                                <div class="avatar">👤</div>
                                <div class="status-dot"></div>
                            </div>
                            <div class="card-body">
                                <div class="username">${user.nombre}</div>
                                <span class="role-badge" style="background-color: ${user.color_rol};">
                                    ${user.rol}
                                </span>
                                <div class="inspect-hint">🔍 Haz clic para inspeccionar</div>
                            </div>
                        </div>
                    `;
                });
            });

        function inspectProfile(index) {
            const user = usuariosData[index];
            document.getElementById('modalName').innerText = user.nombre;
            document.getElementById('modalRole').innerHTML = `
                <span class="role-badge" style="background-color: ${user.color_rol};">
                    ${user.rol}
                </span>
            `;

            const statsContainer = document.getElementById('modalStats');
            
            if (user.stats) {
                let htmlContent = '';

                if (user.stats.palenques) {
                    htmlContent += `
                        <div class="stat-item">
                            <img class="stat-emoji" src="https://cdn.discordapp.com/emojis/1324544397815054337.webp?size=32" alt="Palenques">
                            <b>Palenques:</b> ${user.stats.palenques}
                        </div>
                    `;
                }

                if (user.stats.rolas) {
                    htmlContent += `
                        <div class="stat-item">
                            <img class="stat-emoji" src="https://cdn.discordapp.com/emojis/1314432633215651850.webp?size=32" alt="Rolas">
                            <b>Rolas:</b> ${user.stats.rolas}
                        </div>
                    `;
                }

                if (user.stats.pais) {
                    htmlContent += `<div class="stat-item">📍 <b>PAIS:</b> ${user.stats.pais}</div>`;
                }

                if (user.stats.estado) {
                    htmlContent += `
                        <div class="stat-item" style="color: #f87171; font-weight: bold;">
                            ${user.stats.estado}
                        </div>
                    `;
                }

                statsContainer.innerHTML = htmlContent;
            } else {
                statsContainer.innerHTML = `
                    <div class="stat-item" style="justify-content: center; color: #949ba4;">
                        Sin información adicional.
                    </div>
                `;
            }

            document.getElementById('profileModal').style.display = 'flex';
        }

        function openDiscordModal() {
            document.getElementById('discordModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>

</body>
</html>
