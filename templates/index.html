<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJN WEB</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0e17] text-white min-h-screen">

    <header class="bg-[#161622] p-4 border-b border-indigo-900/40 flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-bold text-indigo-400">Bienvenid@s a CJN WEB</h1>
        <button onclick="openDiscordModal()" class="bg-[#5865F2] hover:bg-[#4752C4] px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition">
            Discord
        </button>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
        {% for usuario in usuarios %}
        <div class="bg-[#1a1a24] rounded-2xl overflow-hidden shadow-xl border border-gray-800 flex flex-col">
            <!-- Banner -->
            <div class="h-32 bg-gray-900 relative overflow-hidden">
                {% if usuario.banner %}
                <img src="{{ url_for('static', filename=usuario.banner) }}" alt="Banner" class="w-full h-full object-cover">
                {% endif %}
            </div>

            <!-- Avatar y datos -->
            <div class="p-6 pt-0 relative flex flex-col items-center flex-grow">
                <div class="-mt-12 w-20 h-20 rounded-full bg-gray-800 border-4 border-[#1a1a24] flex items-center justify-center relative shadow-md">
                    <span class="text-2xl">👑</span>
                    <div class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-[#1a1a24]"></div>
                </div>

                <h2 class="text-xl font-bold mt-2">{{ usuario.nombre }}</h2>
                
                <span class="px-4 py-1 rounded-full text-xs font-bold text-white mt-2 shadow" style="background-color: {{ usuario.color_rol }};">
                    {{ usuario.rol }}
                </span>

                <button onclick='inspectProfile({{ usuario | tojson | safe }})' class="mt-6 w-full py-2 bg-gray-800/60 hover:bg-gray-800 rounded-lg text-sm text-gray-300 flex items-center justify-center gap-2 transition border border-gray-700/50">
                    🔍 Haz clic para inspeccionar
                </button>
            </div>
        </div>
        {% endfor %}
    </main>

    <!-- Modal de Inspección de Perfil -->
    <div id="profileModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-[#161622] border border-gray-800 rounded-2xl max-w-md w-full p-6 relative shadow-2xl">
            <button onclick="closeModal('profileModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            <div id="modalContent">
                <!-- Se llena dinámicamente con los datos -->
            </div>
        </div>
    </div>

    <!-- Modal de Discord -->
    <div id="discordModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-[#161622] border border-gray-800 rounded-2xl max-w-sm w-full p-6 text-center relative shadow-2xl">
            <button onclick="closeModal('discordModal')" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            <h3 class="text-xl font-bold text-indigo-400 mb-2">¡Únete a nuestro Discord!</h3>
            <p class="text-gray-400 text-sm mb-6">Conéctate con la comunidad y el equipo.</p>
            <a href="https://discord.com" target="_blank" class="inline-block bg-[#5865F2] hover:bg-[#4752C4] px-6 py-2.5 rounded-lg font-semibold transition">
                Ir al Servidor
            </a>
        </div>
    </div>

    <script>
        function inspectProfile(user) {
            const modalContent = document.getElementById('modalContent');
            let statsHtml = '';
            
            if (user.stats) {
                for (const [key, value] of Object.entries(user.stats)) {
                    statsHtml += `<div class="bg-gray-900/60 p-3 rounded-xl border border-gray-800 mb-2 flex justify-between items-center">
                        <span class="text-gray-400 capitalize text-sm">${key}:</span>
                        <span class="font-semibold text-white text-sm">${value}</span>
                    </div>`;
                }
            }

            modalContent.innerHTML = `
                <div class="text-center mb-4">
                    <h2 class="text-2xl font-bold text-white mb-1">${user.nombre}</h2>
                    <span class="inline-block px-3 py-1 rounded-full text-xs font-bold text-white" style="background-color: ${user.color_rol};">
                        ${user.rol}
                    </span>
                </div>
                <div class="space-y-1">
                    <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Estadísticas y Detalles</h4>
                    ${statsHtml}
                </div>
            `;
            
            document.getElementById('profileModal').classList.remove('hidden');
            document.getElementById('profileModal').classList.add('flex');
        }

        function openDiscordModal() {
            document.getElementById('discordModal').classList.remove('hidden');
            document.getElementById('discordModal').classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('flex');
            document.getElementById(id).classList.add('hidden');
        }
    </script>
</body>
</html>
