<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CJN WEB - Staff</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .discord-card {
            background-color: #2f3136;
            border-radius: 12px;
            width: 280px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .banner {
            height: 110px;
            background-size: cover;
            background-position: center;
            background-color: #202225;
            position: relative;
        }
        .avatar-wrapper {
            position: absolute;
            bottom: -35px;
            left: 20px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 6px solid #2f3136;
            overflow: hidden;
            background-color: #202225;
        }
        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .crown {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            z-index: 5;
        }
        .card-body {
            padding: 45px 20px 20px 20px;
        }
        .username {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .role-badge {
            display: inline-block;
            background-color: #5865F2;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>Directorio de Staff</h1>
    <div class="container" id="staff-container"></div>

    <script>
        fetch('/api/usuarios')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('staff-container');
                container.innerHTML = '';
                
                data.forEach(user => {
                    let bannerStyle = '';
                    if (user.banner) {
                        bannerStyle = `background-image: url('/static/${user.banner}');`;
                    }

                    container.innerHTML += `
                        <div class="discord-card">
                            <div class="banner" style="${bannerStyle}">
                                <div class="avatar-wrapper">
                                    <span class="crown">👑</span>
                                    <img src="/static/${user.avatar}" alt="Avatar">
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="username">${user.nombre}</div>
                                <div class="role-badge">${user.rol}</div>
                            </div>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
